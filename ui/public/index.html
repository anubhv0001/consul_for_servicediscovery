<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services registered in Consul</title>
<style>
  :root {
    --bg: #f3f5f7; --card: #ffffff; --ink: #17212b; --muted: #5b6876; --line: #d5dce3;
    --pass: #17663f; --pass-bg: #e1f3e8; --crit: #a61b12; --crit-bg: #fde8e6;
    --warn: #7a5200; --warn-bg: #fdf1d6; --link: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  a { color: var(--link); }
  .panel { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px 18px; text-align: left; }
  th { font-size: .85rem; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  code { font: .95rem Consolas, "SFMono-Regular", Menlo, monospace; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 10px; border-radius: 999px; font-size: .9rem; font-weight: 600; }
  .pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .passing  { color: var(--pass); background: var(--pass-bg); }
  .critical { color: var(--crit); background: var(--crit-bg); }
  .warning  { color: var(--warn); background: var(--warn-bg); }
  .empty { padding: 32px 18px; color: var(--muted); }
  .empty code { display: block; margin-top: 8px; color: var(--ink); }
  .error { margin-top: 24px; padding: 14px 18px; border-radius: 10px; background: var(--crit-bg); color: var(--crit); font-weight: 600; }
  footer { margin-top: 12px; color: var(--muted); font-size: .9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Services registered in Consul</h1>
      <p>Each service adds itself when it starts and removes itself when it stops.</p>
    </div>
    <a href="http://localhost:8500/ui" target="_blank" rel="noreferrer">Open the Consul UI</a>
  </header>

  <div id="error" class="error" role="alert" hidden></div>

  <div class="panel" id="panel">
    <table>
      <thead><tr><th>Service</th><th>Address</th><th>Health</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>
      No services are registered yet. Start one in a new terminal:
      <code>npm run product</code>
    </div>
  </div>
  <footer id="updated" aria-live="polite">Connecting…</footer>
</main>

<script>
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const errorBox = document.getElementById('error');
  const panel = document.getElementById('panel');
  const updated = document.getElementById('updated');
  const LABEL = { passing: 'Healthy', critical: 'Unhealthy', warning: 'Warning' };

  function cell(text, className) {
    const td = document.createElement('td');
    if (className) {
      const span = document.createElement('span');
      span.className = className;
      span.textContent = text;
      td.appendChild(span);
    } else {
      td.textContent = text;
    }
    return td;
  }

  async function refresh() {
    try {
      const response = await fetch('/api/services');
      const data = await response.json();
      if (!response.ok) throw new Error(data.error);
      errorBox.hidden = true;
      panel.hidden = false;
      rows.replaceChildren(...data.services.map(s => {
        const tr = document.createElement('tr');
        const name = cell(s.name);
        name.style.fontWeight = '600';
        const address = document.createElement('td');
        const code = document.createElement('code');
        code.textContent = `${s.address}:${s.port}`;
        address.appendChild(code);
        tr.append(name, address, cell(LABEL[s.status] || s.status, `pill ${s.status}`));
        return tr;
      }));
      empty.hidden = data.services.length > 0;
      updated.textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 3 seconds`;
    } catch (error) {
      errorBox.textContent = error.message || 'Cannot reach the UI server.';
      errorBox.hidden = false;
      panel.hidden = true;
      updated.textContent = 'Not connected';
    }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
